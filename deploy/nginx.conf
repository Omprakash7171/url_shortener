# URL shortener reverse proxy / load balancer (stages 17-19).
# Passive health checks: after 2 failed requests within 10s an upstream is
# marked down; DNS is re-resolved so scaled replicas of the 'api' service are
# picked up and stopped ones are dropped.

upstream us_api {
    # Deterministic Compose replica names (url-shortener-api-N). Classic weighted
    # round-robin plus passive health checks: after max_fails failures within
    # fail_timeout a peer is marked down and skipped.
    server url-shortener-api-1:8080 max_fails=2 fail_timeout=10s;
    server url-shortener-api-2:8080 max_fails=2 fail_timeout=10s;
    server url-shortener-api-3:8080 max_fails=2 fail_timeout=10s;
    # keepalive intentionally off so this single-entry demo round-robins across
    # all upstreams; a web production front would re-enable it (many concurrent
    # connections spread across keepalive peers naturally).
}

server {
    listen 80;
    server_name _;

    # Pass the client's real address through so per-IP rate limiting and logs
    # see the caller, not the proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504 http_429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    # Sanity endpoints terminate here.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    # Ready checks pass through to one API instance.
    location = /ready {
        proxy_pass http://us_api/ready;
    }

    location / {
        proxy_pass http://us_api;
        add_header X-Upstream $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
    }
}