global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - url-shortener-api-1:8080
          - url-shortener-api-2:8080
          - url-shortener-api-3:8080
        labels:
          role: api

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - url-shortener-worker-1:8081
        labels:
          role: worker